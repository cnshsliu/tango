# Run one TypeScript test file on Windows with a short per-test timeout, everything printed:
# the fast loop of the Windows port (the full `ci` run is a quarter of an hour).
#   gh workflow run windows-diag.yml -f file=processes
#   gh workflow run windows-diag.yml -f file=agent -f ps=powershell.exe
#   (file: the name under tests/ without .test.ts, empty runs them all; ps forces a PowerShell
#   executable — powershell.exe is the 5.1 every Windows has, the runner also has pwsh 7)
name: windows-diag

on:
  workflow_dispatch:
    inputs:
      file:
        description: Test file to run (under tests/, without .test.ts; empty for all)
        required: false
        default: ''
      timeout:
        description: Per-test timeout in milliseconds
        required: false
        default: '20000'
      name:
        description: 'Only tests whose name matches this pattern; empty runs the whole file'
        required: false
        default: ''
      ps:
        description: PowerShell executable to force (e.g. powershell.exe for 5.1; empty picks pwsh when installed)
        required: false
        default: ''

jobs:
  diag:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - run: choco install ripgrep --yes --no-progress
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: run
        env:
          TANGO_POWERSHELL: ${{ inputs.ps }}
          DIAG_FILE: ${{ inputs.file }}
          DIAG_NAME: ${{ inputs.name }}
          DIAG_TIMEOUT: ${{ inputs.timeout }}
        shell: pwsh
        run: |
          $a = @('--import', 'tsx', '--test', "--test-timeout=$env:DIAG_TIMEOUT")
          if ($env:DIAG_NAME) { $a += "--test-name-pattern=`"$($env:DIAG_NAME)`"" }
          $a += if ($env:DIAG_FILE) { "tests/$($env:DIAG_FILE).test.ts" } else { "tests/*.test.ts" }
          node @a
