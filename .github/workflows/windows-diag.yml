# Run one TypeScript test file on Windows with a short per-test timeout, everything printed:
# the fast loop of the Windows port (the full `ci` run is a quarter of an hour).
#   gh workflow run windows-diag.yml -f file=processes
#   (file: the name under tests/ without .test.ts; empty runs them all)
name: windows-diag

on:
  workflow_dispatch:
    inputs:
      file:
        description: Test file to run (under tests/, without .test.ts; empty for all)
        required: false
        default: ''
      timeout:
        description: Per-test timeout in milliseconds
        required: false
        default: '20000'

jobs:
  diag:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - run: choco install ripgrep --yes --no-progress
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: run
        run: node --import tsx --test --test-timeout=${{ inputs.timeout }} ${{ inputs.file == '' && '"tests/*.test.ts"' || format('"tests/{0}.test.ts"', inputs.file) }}
